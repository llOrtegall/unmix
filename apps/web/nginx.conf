server {
  listen 80;
  root /usr/share/nginx/html;

  # Same-origin API: the browser never needs CORS for /api.
  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Server-Sent Events: stream, do not buffer.
    proxy_buffering off;
    proxy_read_timeout 1h;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # SPA routes such as /tracks/:id
  location / {
    try_files $uri /index.html;
  }
}
