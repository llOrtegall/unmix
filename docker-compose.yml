name: unmix

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-unmix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-unmix}
      POSTGRES_DB: ${POSTGRES_DB:-unmix}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-unmix}"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  # S3-compatible object storage (SeaweedFS). Dev credentials live in
  # infra/seaweedfs/s3.json and must match S3_ACCESS_KEY / S3_SECRET_KEY.
  s3:
    image: chrislusf/seaweedfs:4.50
    command: >
      server -dir=/data -ip=s3 -ip.bind=0.0.0.0
      -master.volumeSizeLimitMB=1024
      -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "9000:8333"
    volumes:
      - s3data:/data
      - ./infra/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8333/healthz >/dev/null"]
      interval: 5s
      retries: 20

  # Creates the bucket once storage is ready.
  s3-init:
    image: amazon/aws-cli:latest
    depends_on:
      s3:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-unmix}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-unmix-secret}
      AWS_DEFAULT_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-unmix}
    entrypoint: >
      /bin/sh -c "
      aws --endpoint-url http://s3:8333 s3api head-bucket --bucket $${S3_BUCKET} 2>/dev/null ||
      aws --endpoint-url http://s3:8333 s3 mb s3://$${S3_BUCKET}
      "

  # Phase 3
  # api:
  #   build: ./apps/api
  #   env_file: .env
  #   ports: ["3000:3000"]
  #   depends_on: [postgres, redis, s3]

  worker:
    build: ./services/worker
    env_file: .env
    environment:
      # Container network addresses override the host values in .env.
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://s3:8333
    depends_on:
      redis:
        condition: service_healthy
      s3:
        condition: service_healthy
    stop_grace_period: 2m
    restart: unless-stopped

  # Phase 4
  # web:
  #   build: ./apps/web
  #   ports: ["5173:5173"]
  #   depends_on: [api]

volumes:
  pgdata:
  redisdata:
  s3data:
