name: unmix

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-unmix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-unmix}
      POSTGRES_DB: ${POSTGRES_DB:-unmix}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-unmix}"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-unmix}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-unmix-secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 10

  # Creates the bucket once MinIO is ready.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${S3_ACCESS_KEY:-unmix} $${S3_SECRET_KEY:-unmix-secret} &&
      mc mb --ignore-existing local/$${S3_BUCKET:-unmix}
      "
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-unmix}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-unmix-secret}
      S3_BUCKET: ${S3_BUCKET:-unmix}

  # Phase 3
  # api:
  #   build: ./apps/api
  #   env_file: .env
  #   ports: ["3000:3000"]
  #   depends_on: [postgres, redis, minio]

  # Phase 2
  # worker:
  #   build: ./services/worker
  #   env_file: .env
  #   depends_on: [redis, minio]

  # Phase 4
  # web:
  #   build: ./apps/web
  #   ports: ["5173:5173"]
  #   depends_on: [api]

volumes:
  pgdata:
  redisdata:
  miniodata:
