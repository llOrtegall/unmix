[project]
name = "unmix-worker"
version = "0.1.0"
description = "Separation worker: consumes separation jobs and splits tracks into stems with Demucs"
requires-python = ">=3.12,<3.13"
dependencies = [
  "bullmq>=2",
  "boto3>=1.35",
  "pydantic>=2.9",
  "soundfile>=0.12",
  "numpy>=1.26",
  "demucs==4.0.1",
  # torchaudio 2.9 drops the backends demucs 4.0.1 uses to load audio.
  "torch==2.8.0",
  "torchaudio==2.8.0",
  # Audio-to-MIDI. Runs its bundled ONNX model; see the TensorFlow override below.
  "basic-pitch==0.4.0",
  "onnxruntime>=1.20",
  # resampy (a basic-pitch dependency) still imports pkg_resources.
  "setuptools<81",
  "pydantic-settings>=2.16.2",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "ruff>=0.7",
  "import-linter>=2.1",
  "datamodel-code-generator>=0.26",
  "faker>=40.44.0",
  "pytest-cov>=7.1.0",
  "mypy>=2.4.1",
  "testcontainers>=4.15.0",
  "boto3-stubs[s3]>=1.43.121",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/unmix_worker"]

[tool.uv]
# basic-pitch 0.4 requires tensorflow<2.15.1, which has no Python 3.12 wheels. The worker
# only uses its ONNX model, so the TensorFlow/CoreML requirements are dropped.
override-dependencies = [
  "tensorflow; sys_platform == 'never'",
  "tensorflow-macos; sys_platform == 'never'",
  "coremltools; sys_platform == 'never'",
]
environments = ["sys_platform == 'linux'"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=unmix_worker.modules --cov-report=term-missing:skip-covered --cov-fail-under=80"

[tool.coverage.run]
omit = ["*/factory.py"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["src/unmix_worker/contracts/generated.py", "spike"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
files = ["src", "tests", "scripts"]

[[tool.mypy.overrides]]
module = "unmix_worker.contracts.generated"
ignore_errors = true

[[tool.mypy.overrides]]
module = ["basic_pitch.*", "bullmq.*", "onnxruntime.*", "soundfile"]
ignore_missing_imports = true

# Architecture rules (ADR 0018, ADR 0031): dependencies point toward the domain.
[tool.importlinter]
root_package = "unmix_worker"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Module layers point toward the domain"
type = "layers"
containers = ["unmix_worker.modules.separation"]
layers = ["infrastructure", "application", "domain"]
ignore_imports = [
  "unmix_worker.modules.separation.application.factory -> unmix_worker.modules.separation.infrastructure.**",
]

[[tool.importlinter.contracts]]
name = "The domain imports no packages, contracts or entrypoints"
type = "forbidden"
source_modules = ["unmix_worker.modules.shared.domain", "unmix_worker.modules.separation.domain"]
forbidden_modules = [
  "unmix_worker.contracts",
  "unmix_worker.consumers",
  "unmix_worker.config",
  "unmix_worker.main",
  "bullmq",
  "boto3",
  "botocore",
  "pydantic",
  "pydantic_settings",
  "torch",
  "torchaudio",
  "demucs",
  "soundfile",
  "numpy",
  "basic_pitch",
  "onnxruntime",
]

[[tool.importlinter.contracts]]
name = "Use cases import no packages or contracts, except the factory"
type = "forbidden"
source_modules = ["unmix_worker.modules.separation.application"]
forbidden_modules = [
  "unmix_worker.contracts",
  "bullmq",
  "boto3",
  "botocore",
  "pydantic",
  "pydantic_settings",
  "torch",
  "torchaudio",
  "demucs",
  "soundfile",
  "numpy",
  "basic_pitch",
  "onnxruntime",
]
ignore_imports = [
  "unmix_worker.modules.separation.application.factory -> bullmq",
  "unmix_worker.modules.separation.application.factory -> unmix_worker.modules.separation.infrastructure.**",
]

[[tool.importlinter.contracts]]
name = "Entrypoints never import infrastructure"
type = "forbidden"
source_modules = ["unmix_worker.consumers"]
forbidden_modules = ["unmix_worker.modules.separation.infrastructure"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Modules never import entrypoints or the bootstrap"
type = "forbidden"
source_modules = ["unmix_worker.modules"]
forbidden_modules = ["unmix_worker.consumers", "unmix_worker.config", "unmix_worker.main"]
