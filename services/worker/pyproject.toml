[project]
name = "unmix-worker"
version = "0.1.0"
description = "Separation worker: consumes separation jobs and splits tracks into stems with Demucs"
requires-python = ">=3.12,<3.13"
dependencies = [
  "bullmq>=2",
  "boto3>=1.35",
  "pydantic>=2.9",
  "soundfile>=0.12",
  "numpy>=1.26",
  "demucs==4.0.1",
  # torchaudio 2.9 drops the backends demucs 4.0.1 uses to load audio.
  "torch==2.8.0",
  "torchaudio==2.8.0",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "ruff>=0.7",
  "import-linter>=2.1",
  "datamodel-code-generator>=0.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/unmix_worker"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["src/unmix_worker/contracts/generated.py", "spike"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

# Architecture rules (ADR 0018): dependencies point toward the domain.
[tool.importlinter]
root_package = "unmix_worker"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Hexagonal layers"
type = "layers"
layers = [
  "unmix_worker.main",
  "unmix_worker.adapters",
  "unmix_worker.application",
  "unmix_worker.domain",
]

[[tool.importlinter.contracts]]
name = "Domain and application stay free of frameworks"
type = "forbidden"
source_modules = ["unmix_worker.domain", "unmix_worker.application"]
forbidden_modules = [
  "unmix_worker.contracts",
  "bullmq",
  "boto3",
  "torch",
  "demucs",
  "soundfile",
  "pydantic",
]
